name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'checklists.missionit.com/**'
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Deny all permissions at the workflow level; each job grants only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Install docs dependencies
        run: cd docs-site && pnpm install --frozen-lockfile

      - name: Build docs site
        run: cd docs-site && pnpm run build

      - name: Stage docs at the public project path
        run: |
          mkdir -p pages-artifact/checklists.missionit.com
          cp -R docs-site/dist/. pages-artifact/checklists.missionit.com/
          cp docs-site/dist/404.html pages-artifact/404.html
          test -f pages-artifact/checklists.missionit.com/index.html
          test -d pages-artifact/checklists.missionit.com/_astro
          test -f pages-artifact/404.html

      - name: Archive pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory pages-artifact/ \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
